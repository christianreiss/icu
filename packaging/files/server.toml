# ICU server configuration. Check server_name and public_host, then:
#   sudo systemctl enable --now icu-server
# Unset, server_name is this host's FQDN (`hostname --fqdn`), but only if it
# resolves to a routable (not loopback or link-local) address of this host;
# otherwise the server refuses to start. Set both explicitly for a DNS alias or behind NAT: the
# names go into the CA and every certificate.
# Reference: /usr/share/doc/icu-server/README.md

[server]
listen = ["0.0.0.0:4711", "[::]:4711"]
# DNS name (or IP) clients connect to; baked into every certificate.
# Default: the host's FQDN, confirmed by DNS (see above). Once there is a CA,
# the name it carries; set to anything else, the server refuses to start.
#server_name = "icu.example.org"
# host:port written into registration bundles. Default: server_name:4711.
#public_host = "icu.example.org:4711"
max_users = 16
# Lowest client version; older clients are refused at Hello (VERSION_UNSUPPORTED).
min_client = "0.1.0"
admin_socket_group = "icu"

[log]
level = "info"
format = "text"

# State backups: a snapshot of /var/lib/icu after every change, in
# /var/lib/icu/backups (root only). Copy that directory off the host too
# (rsync, borg, restic): a snapshot on the same disk does not survive the disk.
# Restore with the server stopped: icu-server restore latest. See the README.
[backup]
# Snapshots kept, oldest go first; 0 turns the automatic ones off.
keep = 30
# Elsewhere, e.g. NFS: the unit needs ReadWritePaths= for it (README).
#dir = "/srv/icu-backups"
