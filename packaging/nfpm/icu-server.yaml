# nfpm config for icu-server (rpm + deb from the same static musl binary).
# Paths are relative to the repository root; packaging/build.sh renders
# ${VERSION}, ${RELEASE}, ${SERVER_BIN} and ${LICENSES_FILE}.
name: icu-server
arch: amd64
platform: linux
version: ${VERSION}
release: ${RELEASE}
section: net
priority: optional
maintainer: Christian Reiß <email@christian-reiss.de>
vendor: ICU
homepage: https://github.com/christianreiss/icu
license: Apache-2.0
description: |-
  ICU voice server.
  QUIC/mTLS relay for a single voice room with its own certificate authority
  and admin CLI. Statically linked, no runtime dependencies.

depends:
  - systemd

contents:
  - src: ${SERVER_BIN}
    dst: /usr/bin/icu-server
    file_info: {mode: 0755}
  # Second name for the admin side (Server/IMPLEMENTATION.md §5.1): the same
  # binary, which looks at argv[0]. Relative, so the link stays inside /usr/bin.
  - src: icu-server
    dst: /usr/bin/icu-cli
    type: symlink
  - src: deploy/icu-server.service
    dst: /usr/lib/systemd/system/icu-server.service
    file_info: {mode: 0644}
  - src: packaging/files/icu-server.sysusers
    dst: /usr/lib/sysusers.d/icu-server.conf
    file_info: {mode: 0644}
  - src: packaging/files/icu.firewalld.xml
    dst: /usr/lib/firewalld/services/icu.xml
    file_info: {mode: 0644}
  - src: packaging/files/server.toml
    dst: /etc/icu/server.toml
    type: config|noreplace
    file_info: {mode: 0640, owner: root, group: icu}
  - dst: /etc/icu
    type: dir
    file_info: {mode: 0755}
  - src: deploy/checkmk/icu_server
    dst: /usr/share/icu-server/checkmk/icu_server
    file_info: {mode: 0755}
  - src: deploy/README.md
    dst: /usr/share/doc/icu-server/README.md
    file_info: {mode: 0644}
  - src: LICENSE
    dst: /usr/share/licenses/icu-server/LICENSE
    file_info: {mode: 0644}
  - src: ${LICENSES_FILE}
    dst: /usr/share/licenses/icu-server/THIRD-PARTY-LICENSES
    file_info: {mode: 0644}

scripts:
  preinstall: packaging/scripts/server-preinstall.sh
  postinstall: packaging/scripts/server-postinstall.sh
  preremove: packaging/scripts/server-preremove.sh
  postremove: packaging/scripts/server-postremove.sh
