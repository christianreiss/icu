# Meson cross file for the Windows AEC build (webrtc-audio-processing,
# built by its crate's build.rs). Used through the `meson` wrapper here.
[binaries]
c = 'x86_64-w64-mingw32-gcc'
cpp = 'x86_64-w64-mingw32-g++'
ar = 'x86_64-w64-mingw32-ar'
strip = 'x86_64-w64-mingw32-strip'
windres = 'x86_64-w64-mingw32-windres'
pkg-config = 'x86_64-w64-mingw32-pkg-config'

[built-in options]
# Static C++ runtime and winpthreads: icu.exe imports system DLLs only.
cpp_link_args = ['-static-libstdc++', '-static-libgcc']
# abseil's cctz takes the local time zone from WinRT when the SDK is at
# least Windows 10 22H2 (NTDDI_WIN10_NI), and mingw's WinRT headers then
# clash (redefinition of IReference<unsigned char>). The AEC never asks for
# a time zone: claim an older SDK there.
cpp_args = ['-DNTDDI_VERSION=0x0A000000']

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
