# cargo-about configuration: generates THIRD-PARTY-LICENSES for the rpm/deb
# packages (packaging/build.sh). Accepted licenses mirror deny.toml.
accepted = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unlicense",
    "BSL-1.0",
    "MPL-2.0",
    "IJG",
]
targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# `license-file = COPYING`, verbatim Google BSD-3-Clause (deny.toml, Research/aec.md E6).
# Checksums are SHA-256 of COPYING in the 2.1.0 crates; a version bump must
# re-check the text.
[webrtc-audio-processing.clarify]
license = "BSD-3-Clause"
[[webrtc-audio-processing.clarify.files]]
path = "COPYING"
license = "BSD-3-Clause"
checksum = "6db9d4840c6ff0fb3c37ace8e32cfd3eb6c6e759c67b4ecbee969cd8d75154a9"

[webrtc-audio-processing-config.clarify]
license = "BSD-3-Clause"
[[webrtc-audio-processing-config.clarify.files]]
path = "COPYING"
license = "BSD-3-Clause"
checksum = "9b79539028e216e813e152d45f5c1ed5fdd0554426ad50270fb03134e7082dac"

[webrtc-audio-processing-sys.clarify]
license = "BSD-3-Clause"
[[webrtc-audio-processing-sys.clarify.files]]
path = "COPYING"
license = "BSD-3-Clause"
checksum = "9b79539028e216e813e152d45f5c1ed5fdd0554426ad50270fb03134e7082dac"
