[workspace]
members = ["crates/icu-proto", "crates/icu-server", "crates/icu-client"]
# Die Spikes unter experiments/ sind eigenstaendige Pakete und gehoeren nicht
# in diesen Workspace; ohne exclude meldet cargo dort "believes it's in a workspace".
exclude = [
    "experiments/spike-aec",
    "experiments/spike-audio",
    "experiments/spike-camera",
    "experiments/spike-quic",
    "experiments/spike-wayland",
    "experiments/spike-xwin",
]
resolver = "2"

[workspace.package]
version = "0.1.10"
edition = "2021"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/christianreiss/icu"

[workspace.dependencies]
icu-proto = { path = "crates/icu-proto" }

# Wire / Serialisierung
serde = { version = "1", features = ["derive"] }
# postcard: default = ["heapless-cas"], `use-std` muss explizit dazu (A24).
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }

# Transport. quinn-Defaults ziehen platform-verifier und damit
# rustls-platform-verifier mit; fuer den statischen musl-Build abschalten (A7).
quinn = { version = "0.11.12", default-features = false, features = [
    "runtime-tokio",
    "rustls-ring",
    "log",
] }
# rustls ohne Default-Provider, sonst kommt aws-lc-sys (C/bindgen) mit (A7).
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
ring = "0.17.14"
# Konstantzeit-Vergleich des gekuerzten Com-Tags (icu_proto::com); schon ueber rustls im Baum.
subtle = "2.6.1"
rcgen = { version = "0.14.10", features = ["x509-parser"] }
# 0.18, nicht 0.16: rcgen 0.14.10 haengt an ^0.18 (A11/E16).
x509-parser = "0.18"
# PEM fuer server.crt.retired, so wie rcgen schreibt; schon ueber rcgen im Baum.
pem = "4.0.0"

tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
# icu-server shell: Cisco-style admin REPL (TAB completion, history). Pure
# Rust, no C toolchain step, safe for the static-musl release-server build.
rustyline = "14"
toml = "0.8"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
base64 = "0.22"
sha2 = "0.10"
rand = "0.9"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
rustix = { version = "1", features = ["fs", "process", "system", "termios"] }
unicode-width = "0.2"
socket2 = "0.6"
tempfile = "3"
# Namenspruefung (UTS #39 Confusables, NFC, General Category).
unicode-normalization = "0.1.25"
unicode-security = "0.1.2"
unicode-general-category = "1.1.0"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Der Server wird mit diesem Profil gebaut (packaging/build.sh,
# deploy/Dockerfile): ein Panic in einem Verbindungs-Task soll diesen Task
# beenden, nicht jedes Gespraech auf dem Server. panic laesst sich nur in
# einem eigenen Profil setzen, nicht je Paket; der Client bleibt bei abort.
[profile.release-server]
inherits = "release"
panic = "unwind"
