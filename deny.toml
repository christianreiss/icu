# cargo-deny Konfiguration fuer den gesamten ICU-Workspace (Server und Client).
# Allowlist aus docs/reference/server.md §9 / docs/reference/client.md §12.
# Schema: cargo-deny v2 (`[licenses] version = 2`).

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-unknown-linux-musl" },
    { triple = "x86_64-pc-windows-gnu" },
]
# Auch die optionalen Features (`cpal-fallback`, `glow`), sonst
# prueft der Build nur den Graph der Default-Features.
all-features = true

[licenses]
version = 2
# Alles, was hier nicht steht, bricht den Build.
allow = [
    "MIT",
    "Apache-2.0",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    # Client (M1/M2/M4, 2026-09-20): egui-Default-Fonts (OFL-1.1 + Ubuntu-font),
    # ksni (Unlicense), clipboard-win/error-code (BSL-1.0), option-ext via
    # directories (MPL-2.0, nur Datei-Copyleft). cargo-deny selbst war auf dem
    # Build-Host nicht installiert; Liste aus `cargo metadata` abgeleitet.
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unlicense",
    "BSL-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

# target-lexicon ist reine Build-Abhaengigkeit (system-deps -> cfg-expr) und
# landet nicht im Binary; LLVM-exception erweitert Apache-2.0 nur.
[[licenses.exceptions]]
name = "target-lexicon"
allow = ["Apache-2.0 WITH LLVM-exception"]

# nokhwa (Default-Feature `decoding`) dekodiert MJPEG ueber mozjpeg; IJG ist
# die libjpeg-Lizenz und gilt nur fuer diese beiden Crates (Client, Feature
# `camera`).
[[licenses.exceptions]]
name = "mozjpeg"
allow = ["IJG"]

[[licenses.exceptions]]
name = "mozjpeg-sys"
allow = ["IJG"]

# webrtc-audio-processing 2.1 traegt `license-file = COPYING` statt eines
# SPDX-Ausdrucks; der Text ist woertlich die Google-BSD-3-Clause
# (docs/research/aec.md E6).
# `hash` ist der XxHash32 der Datei, wie cargo-deny ihn rechnet (Zeilenenden
# auf `\n` normalisiert). Passt er nicht, ignoriert cargo-deny die
# Klarstellung stillschweigend und prueft das Crate wie ohne sie; `hash = 0`
# galt deshalb nie. Aendert eine neue Version die Datei, gilt dasselbe: den
# Text pruefen, dann den Hash neu setzen.
[[licenses.clarify]]
name = "webrtc-audio-processing"
expression = "BSD-3-Clause"
license-files = [{ path = "COPYING", hash = 0x3d3ea952 }]

[[licenses.clarify]]
name = "webrtc-audio-processing-config"
expression = "BSD-3-Clause"
license-files = [{ path = "COPYING", hash = 0x7e861f0d }]

[[licenses.clarify]]
name = "webrtc-audio-processing-sys"
expression = "BSD-3-Clause"
license-files = [{ path = "COPYING", hash = 0x7e861f0d }]

# ring ist "Apache-2.0 AND ISC" mit zusaetzlichen Dateien ohne SPDX-Header;
# beide Lizenzen stehen in der Allowlist.
[[licenses.clarify]]
name = "ring"
expression = "Apache-2.0 AND ISC"
license-files = [{ path = "LICENSE", hash = 0x0d99693a }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Ein TLS-/Krypto-Stack: rustls auf ring, ohne Default-Provider
# (docs/history/review-specs-2026-09-20.md A7, Cargo.toml). aws-lc-sys (C,
# bindgen) bricht den statischen musl-Server, OpenSSL gehoert nicht in den
# Graph. Kommt eins davon ueber ein Default-Feature zurueck, bricht der Build.
deny = [
    { crate = "aws-lc-rs", reason = "rustls laeuft auf ring (A7)" },
    { crate = "aws-lc-sys", reason = "rustls laeuft auf ring (A7)" },
    { crate = "openssl", reason = "kein zweiter TLS-Stack neben rustls (A7)" },
    { crate = "openssl-sys", reason = "kein zweiter TLS-Stack neben rustls (A7)" },
]

[advisories]
version = 2
yanked = "deny"
# Unmaintained, no vulnerability and no safe upgrade; each checked
# 2026-09-26 (cargo deny check, advisory DB of that day).
ignore = [
    # Proc macro, runs at compile time only; comes with nokhwa (camera).
    { id = "RUSTSEC-2024-0436", reason = "paste: compile-time proc macro via nokhwa" },
    # Proc macro, compile time only; Windows target graph.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: compile-time proc macro" },
    # Parses only fonts embedded in the client binary (Inter, Phosphor, egui's
    # defaults), never untrusted input; comes with winit's Wayland decorations
    # (sctk-adwaita → ab_glyph) and the overlay's name rendering.
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: only our own embedded fonts" },
    # zbus split into zbus 6 (names/wire modules); the standalone crates get no
    # more releases and there is no vulnerability. They come only through
    # eframe → egui-winit → accesskit_winit → accesskit_unix → atspi-common
    # (Linux accessibility bus), which is waiting for a zbus 6 release.
    # Checked 2026-10-19.
    { id = "RUSTSEC-2026-0370", reason = "zvariant: unmaintained, merged into zbus 6; only via accesskit_unix" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: unmaintained, merged into zbus 6; only via accesskit_unix" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: unmaintained, merged into zbus 6; only via accesskit_unix" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
