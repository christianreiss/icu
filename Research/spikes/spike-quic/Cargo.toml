[package]
name = "spike-quic"
version = "0.1.0"
edition = "2021"

[dependencies]
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.14", features = ["x509-parser"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
x509-parser = "0.16"
ring = "0.17"
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
time = "0.3"
