# Build-Ausgaben bleiben außerhalb des Experiment-Quellbaums.
[build]
target-dir = "../../target/experiments/spike-xwin"

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-ar"
rustflags = ["-L", "native=staticlibs", "-C", "link-arg=-static-libgcc", "-C", "link-arg=-static"]
