[package]
name = "icu-client"
description = "ICU voice client — QUIC/mTLS, Opus, PipeWire, egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Shipped as rpm/deb and from GitHub releases, never to crates.io; also lets
# cargo-deny accept the path dependencies between the three crates.
publish = false
default-run = "icu"

[lib]
name = "icu_client"
path = "src/lib.rs"

[[bin]]
name = "icu"
path = "src/main.rs"

[features]
default = ["aec", "gui", "camera", "overlay", "tray"]
# AEC3 via webrtc-audio-processing (bundled). Needs meson, ninja, clang,
# abseil headers and the rust-objcopy symlink (docs/reference/client.md §12).
aec = ["dep:webrtc-audio-processing", "dep:webrtc-audio-processing-config"]
# egui main window and settings. Without it only `--headless` works.
gui = ["dep:eframe", "dep:egui", "dep:egui-phosphor", "dep:raw-window-handle", "dep:arboard"]
# eframe glow backend in addition to the default wgpu one.
glow = ["eframe?/glow"]
# Camera capture and H.264.
camera = ["dep:nokhwa", "dep:openh264"]
# Wayland layer-shell overlay. Needs `gui`: it is started by the main window
# and draws names with the window's font (ab_glyph).
overlay = ["gui", "dep:smithay-client-toolkit", "dep:wayland-client", "dep:calloop", "dep:calloop-wayland-source", "dep:ab_glyph"]
# Tray icon (ksni on Linux).
tray = ["dep:tray-icon"]
# Emergency audio host through cpal (ALSA) instead of pipewire-rs. Always on
# for Windows (see the target dependencies below).
cpal-fallback = ["dep:cpal"]

[dependencies]
icu-proto.workspace = true

quinn.workspace = true
rustls.workspace = true
rcgen.workspace = true
x509-parser.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal", "fs", "process"] }
clap.workspace = true
toml.workspace = true
serde.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sha2.workspace = true
time.workspace = true

# Audio
opusic-sys = { version = "0.7.5", features = ["bundled", "dred"] }
nnnoiseless = { version = "0.5.2", default-features = false }
webrtc-audio-processing = { version = "~2.1", features = ["bundled"], optional = true }
webrtc-audio-processing-config = { version = "~2.1", optional = true }
ringbuf = "0.5"
cpal = { version = "0.18.2", optional = true }

# UI
eframe = { version = "0.36.2", optional = true }
egui = { version = "0.36.2", optional = true }
egui-phosphor = { version = "0.14.0", optional = true }
# Takes a copied passport off the clipboard again; already in the tree
# through eframe (egui-winit's clipboard).
arboard = { version = "3.6.1", default-features = false, optional = true }

# Camera / video
nokhwa = { version = "0.10.11", features = ["input-native", "camera-sync-impl"], optional = true }
openh264 = { version = "0.9.8", features = ["source"], optional = true }

# Paths
directories = "6"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10.1", features = ["v0_3_49"] }
# `pthread_self` for `audio::rt` (real-time priority through module-rt).
libc = "0.2"
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "global_shortcuts"] }
evdev = { version = "0.13.2", features = ["tokio"] }
# Join/leave notifications (`notify`); already in the tree through ashpd.
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
futures-util = "0.3"
smithay-client-toolkit = { version = "0.21.1", features = ["calloop"], optional = true }
wayland-client = { version = "0.31", optional = true }
calloop = { version = "0.14", optional = true }
calloop-wayland-source = { version = "0.4", optional = true }
tray-icon = { version = "0.25.1", default-features = false, features = ["ksni"], optional = true }
# Rasterizes names in the overlay; already in the tree through egui.
ab_glyph = { version = "0.2.32", optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
# Exact native window for foreground activation after a tray/IPC restore.
raw-window-handle = { version = "0.6.2", optional = true }
# Emergency audio host when WASAPI cannot open a device (audio::native_backend).
cpal = "0.18.2"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Devices_FunctionDiscovery",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Shutdown",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Data_Xml_Dom",
    "UI_Notifications",
] }
tray-icon = { version = "0.25.1", optional = true }
# `#[implement]` (the WASAPI hot-plug callback) expands to `windows_core` paths.
windows-core = "0.62.2"
# Rasterizes names in the overlay, as on Linux.
ab_glyph = { version = "0.2.32", optional = true }

[dev-dependencies]
tempfile.workspace = true
# Headless rendering of every window for `tests/ui_layout.rs`; `wgpu` only
# for the optional screenshots (`ICU_UI_SHOTS=<dir>`).
egui_kittest = { version = "0.36.2", features = ["eframe", "wgpu"] }
image = { version = "0.25", default-features = false, features = ["png"] }
# Reads the embedded Inter files' cmap (`ui::fonts` test); already in the
# tree through egui's font stack (epaint).
skrifa = "0.44"

# The server runs on Unix only; the tests that start one in-process are
# Unix only with it.
[target.'cfg(unix)'.dev-dependencies]
icu-server = { path = "../icu-server" }

[[test]]
name = "ui_layout"
required-features = ["gui"]
