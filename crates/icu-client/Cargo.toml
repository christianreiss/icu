[package]
name = "icu-client"
description = "ICU voice client — QUIC/mTLS, Opus, PipeWire, egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
default-run = "icu"

[lib]
name = "icu_client"
path = "src/lib.rs"

[[bin]]
name = "icu"
path = "src/main.rs"

[features]
default = ["aec", "gui", "camera", "overlay", "tray"]
# AEC3 via webrtc-audio-processing (bundled). Needs meson, ninja, clang,
# abseil headers and the rust-objcopy symlink (Client/IMPLEMENTATION.md §12).
aec = ["dep:webrtc-audio-processing", "dep:webrtc-audio-processing-config"]
# egui main window and settings. Without it only `--headless` works.
gui = ["dep:eframe", "dep:egui", "dep:egui-phosphor"]
# eframe glow backend in addition to the default wgpu one.
glow = ["eframe?/glow"]
# Camera capture and H.264.
camera = ["dep:nokhwa", "dep:openh264"]
# Wayland layer-shell overlay.
overlay = ["dep:smithay-client-toolkit", "dep:wayland-client", "dep:calloop", "dep:calloop-wayland-source"]
# Tray icon (ksni on Linux).
tray = ["dep:tray-icon"]
# Emergency audio host through cpal (ALSA) instead of pipewire-rs.
cpal-fallback = ["dep:cpal"]
# MJPEG receive/debug path (never sent in v1).
mjpeg = ["dep:zune-jpeg"]

[dependencies]
icu-proto.workspace = true

quinn.workspace = true
rustls.workspace = true
ring.workspace = true
rcgen.workspace = true
x509-parser.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util", "signal", "fs", "process"] }
bytes.workspace = true
clap.workspace = true
toml.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sha2.workspace = true
rand.workspace = true
time.workspace = true
rustix.workspace = true

# Audio
opus = "0.4.0"
nnnoiseless = { version = "0.5.2", default-features = false }
webrtc-audio-processing = { version = "~2.1", features = ["bundled"], optional = true }
webrtc-audio-processing-config = { version = "~2.1", optional = true }
ringbuf = "0.5"
rubato = "5.0.0"
cpal = { version = "0.18.2", optional = true }

# UI
eframe = { version = "0.36.2", optional = true }
egui = { version = "0.36.2", optional = true }
egui-phosphor = { version = "0.14.0", optional = true }

# Camera / video
nokhwa = { version = "0.10.11", features = ["input-native", "camera-sync-impl"], optional = true }
openh264 = { version = "0.9.8", features = ["source"], optional = true }
zune-jpeg = { version = "0.5", optional = true }

# Paths
directories = "6"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10.1", features = ["v0_3_49"] }
ashpd = { version = "0.13.13", default-features = false, features = ["tokio", "global_shortcuts"] }
evdev = { version = "0.13.2", features = ["tokio"] }
futures-util = "0.3"
smithay-client-toolkit = { version = "0.21.1", features = ["calloop"], optional = true }
wayland-client = { version = "0.31", optional = true }
calloop = { version = "0.14", optional = true }
calloop-wayland-source = { version = "0.4", optional = true }
tray-icon = { version = "0.25.1", default-features = false, features = ["ksni"], optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_UI_Input", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Security_Cryptography"] }
tray-icon = { version = "0.25.1", optional = true }

[dev-dependencies]
icu-server = { path = "../icu-server" }
tempfile.workspace = true
postcard.workspace = true
