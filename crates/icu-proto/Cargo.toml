[package]
name = "icu-proto"
description = "ICU Wire-Protokoll v1 — Typen, Framing und Header-Codec"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
# Shipped as rpm/deb and from GitHub releases, never to crates.io; also lets
# cargo-deny accept the path dependencies between the three crates.
publish = false

[dependencies]
serde.workspace = true
postcard.workspace = true
base64.workspace = true
unicode-normalization.workspace = true
unicode-security.workspace = true
unicode-general-category.workspace = true

[lints.rust]
missing_docs = "warn"
